<script>
    // Sections with hidden rows (news, publications) start showing fewer
    // rows, with a "(show more)" button after the table that toggles between
    // fewer and all rows.

    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("section:not(#profile)").forEach(function (section) {
            var table = section.querySelector("table");
            if (!table || !section.querySelector(".not-selected, .not-recent")) {
                return;
            }

            var button = document.createElement("button");
            button.className = "show-more";
            button.textContent = "(show more)";
            button.setAttribute("aria-expanded", "false");
            table.after(button);

            button.addEventListener("click", function () {
                var expanded = section.classList.toggle("expanded");
                button.textContent = expanded ? "(show less)" : "(show more)";
                button.setAttribute("aria-expanded", expanded ? "true" : "false");
            });
        });
    });
</script>
