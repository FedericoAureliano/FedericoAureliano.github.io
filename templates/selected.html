<script>
    // Sections with hidden rows (news, publications, awards) start showing
    // fewer rows; their headings toggle between fewer and all rows. Every
    // other section starts fully expanded and is not clickable.

    // Shade every other visible row of each table, so the stripes stay even
    // when some rows are hidden.
    function stripeRows(section) {
        section.querySelectorAll("table").forEach(function (table) {
            var visible = 0;
            Array.prototype.forEach.call(table.tBodies, function (body) {
                Array.prototype.forEach.call(body.rows, function (row) {
                    var shown = row.getClientRects().length > 0;
                    row.classList.toggle("row-alt", shown && visible % 2 === 0);
                    if (shown) {
                        visible++;
                    }
                });
            });
        });
    }

    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll("section").forEach(stripeRows);

        document.querySelectorAll("section:not(#profile)").forEach(function (section) {
            var heading = section.querySelector("h1");
            var expandable = section.querySelector(".not-selected, .not-recent") !== null;

            if (!heading) {
                return;
            }

            if (!expandable) {
                // Always open: the arrow points down and nothing toggles.
                section.classList.add("static");
                return;
            }

            section.classList.add("expandable");
            heading.setAttribute("role", "button");
            heading.setAttribute("tabindex", "0");
            heading.setAttribute("aria-expanded", "false");

            function toggle() {
                var expanded = section.classList.toggle("expanded");
                heading.setAttribute("aria-expanded", expanded ? "true" : "false");
                stripeRows(section);
            }

            heading.addEventListener("click", toggle);
            heading.addEventListener("keydown", function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    toggle();
                }
            });
        });
    });
</script>
