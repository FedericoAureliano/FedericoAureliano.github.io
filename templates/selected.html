<script>
    function bindToggle(toggleClass, hiddenClass, expandedLabel) {
        var toggle = document.getElementsByClassName(toggleClass)[0];
        if (!toggle) {
            return;
        }

        toggle.onclick = function (event) {
            event.preventDefault();

            var section = toggle.closest("section");
            var hiddenItems = (section || document).getElementsByClassName(hiddenClass);
            var showHidden = toggle.textContent === "(show all)";

            for (var i = 0; i < hiddenItems.length; i++) {
                hiddenItems[i].style.display = showHidden ? "revert" : "none";
            }

            toggle.textContent = showHidden ? expandedLabel : "(show all)";
        };
    }

    window.onload = function () {
        bindToggle("toggle-publications", "not-selected", "(show selected)");
        bindToggle("toggle-awards", "not-selected", "(show selected)");
        bindToggle("toggle-recent", "not-recent", "(show recent)");
    };
</script>
